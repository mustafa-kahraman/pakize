[project]
name = "pakize"
version = "0.3.0"
description = "Metni ses dosyasına çeviren, kod bloklarını okumayan yerel TTS aracı"
readme = "README.en.md"
authors = [
    { name = "Mustafa Kahraman" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "tts",
    "text-to-speech",
    "cli",
    "markdown",
    "audiobook",
    "turkish",
    "edge-tts",
    "piper",
    "accessibility",
]
# Lisans burada SPDX ifadesiyle verildiği için ayrıca "License ::" sınıflandırıcısı
# yazılmaz; ikisi bir arada olursa PyPI paketi reddeder.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]

dependencies = [
    "edge-tts>=7.2.8",
    "psutil>=6.0",
    "tomli>=2.0 ; python_full_version < '3.11'",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/mustafa-kahraman/pakize"
Repository = "https://github.com/mustafa-kahraman/pakize"
Issues = "https://github.com/mustafa-kahraman/pakize/issues"

[project.scripts]
pakize = "pakize.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
